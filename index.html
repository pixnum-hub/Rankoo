<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rankoo — world's best-selling software & apps</title>
<meta name="description" content="Browse and compare the world's best-selling software and apps by category, with rankings, stats and publisher info.">
<meta name="theme-color" content="#0b0e14">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rankoo">
<style>
  :root{
    --radius:10px;
    --mono:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  html[data-theme="dark"]{
    --bg:#0b0e14;--bg-elev:#121722;--bg-input:#0e1219;--text:#e6e9ef;--text-dim:#7d8797;
    --accent:#5eead4;--accent2:#f0b429;--border:#232936;--bw:1px;
  }
  html[data-theme="light"]{
    --bg:#f5f6f8;--bg-elev:#ffffff;--bg-input:#ffffff;--text:#14171f;--text-dim:#5b6472;
    --accent:#0f9488;--accent2:#a9670f;--border:#dbe0e6;--bw:1px;
  }
  html[data-theme="oled"]{
    --bg:#000000;--bg-elev:#0a0a0a;--bg-input:#000000;--text:#f5f5f5;--text-dim:#8a8a8a;
    --accent:#5eead4;--accent2:#f0b429;--border:#1c1c1c;--bw:1px;
  }
  html[data-theme="hc"]{
    --bg:#000000;--bg-elev:#000000;--bg-input:#000000;--text:#ffffff;--text-dim:#ffffff;
    --accent:#ffff00;--accent2:#00ffff;--border:#ffffff;--bw:2px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;overflow-x:hidden;width:100%;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--mono);
    transition:background .2s,color .2s;-webkit-font-smoothing:antialiased;overflow-x:hidden;width:100%;}
  button,select{touch-action:manipulation;}
  .wrap{min-height:100vh;display:flex;flex-direction:column;max-width:820px;width:100%;margin:0 auto;
    padding:16px calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom))
    calc(16px + env(safe-area-inset-left));}
  button,select,.chip,.tbtn,.icon-btn,.theme-btn,.cat-toggle{white-space:normal;word-break:break-word;overflow-wrap:break-word;}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 2px 20px;
    min-width:0;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  h1{margin:0;font-size:1.65rem;letter-spacing:.5px;}
  .tag{margin:2px 0 0;font-size:.85rem;color:var(--text-dim);}
  .theme-btn{background:var(--bg-elev);color:var(--text);border:var(--bw) solid var(--border);
    border-radius:var(--radius);padding:10px 14px;font-family:var(--mono);font-size:.9rem;cursor:pointer;
    min-height:40px;flex-shrink:0;}
  .theme-btn:hover{border-color:var(--accent);}
  main{flex:1;}
  .search{display:flex;align-items:center;gap:8px;background:var(--bg-input);border:var(--bw) solid var(--border);
    border-radius:var(--radius);padding:12px;margin-bottom:12px;min-width:0;}
  #query{flex:1;background:transparent;border:0;outline:0;color:var(--text);font-family:var(--mono);
    font-size:17px;min-width:0;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
  .cat-dropdown{position:relative;margin-bottom:18px;}
  .cat-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--bg-elev);color:var(--text);border:var(--bw) solid var(--border);
    border-radius:var(--radius);padding:13px 14px;font-family:var(--mono);font-size:.95rem;cursor:pointer;
    min-height:44px;}
  .cat-toggle:hover{border-color:var(--accent);}
  .caret{color:var(--text-dim);transition:transform .15s;}
  .cat-toggle.open .caret{transform:rotate(180deg);color:var(--accent);}
  .cat-dropdown .chips{display:none;margin:8px 0 16px;padding:10px;background:var(--bg-elev);
    border:var(--bw) solid var(--border);border-radius:var(--radius);max-height:280px;
    overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .cat-dropdown .chips.open{display:flex;}
  .chip{background:var(--bg-elev);color:var(--text-dim);border:var(--bw) solid var(--border);border-radius:999px;
    padding:9px 14px;font-family:var(--mono);font-size:.85rem;cursor:pointer;min-height:38px;}
  .chip.active{color:var(--bg);background:var(--accent);border-color:var(--accent);font-weight:700;}
  .count{font-size:.85rem;color:var(--text-dim);margin:0 2px 12px;}
  .grid{display:grid;grid-template-columns:1fr;gap:10px;min-width:0;}
  @media(min-width:560px){.grid{grid-template-columns:repeat(2,1fr);}}
  .grid>*{min-width:0;}
  .card{background:var(--bg-elev);border:var(--bw) solid var(--border);border-radius:var(--radius);
    padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0;}
  .card .top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .card-head{display:flex;align-items:center;gap:10px;min-width:0;}
  .avatar{width:42px;height:42px;flex-shrink:0;border-radius:10px;display:flex;align-items:center;
    justify-content:center;font-weight:700;color:#fff;font-size:.85rem;letter-spacing:.5px;}
  .card-titles{min-width:0;}
  .rank{color:var(--accent);font-weight:700;font-size:.9rem;}
  .cat{font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;color:var(--bg);
    background:var(--accent2);border-radius:5px;padding:2px 7px;}
  .name{font-size:1.25rem;font-weight:700;margin:0;}
  .pub{font-size:.88rem;color:var(--text-dim);}
  .stat{display:inline-block;margin-top:6px;font-size:.92rem;font-weight:700;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 14%,transparent);border:1px solid var(--accent);
    border-radius:6px;padding:3px 9px;width:fit-content;}
  .blurb{font-size:.92rem;color:var(--text);opacity:.9;margin-top:4px;line-height:1.45;}
  .empty{color:var(--text-dim);font-size:1rem;padding:30px 4px;text-align:center;}
  .refresh-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
    flex-wrap:wrap;margin-bottom:14px;min-width:0;}
  .refresh-btn{background:var(--bg-elev);color:var(--accent);border-color:var(--accent);}
  #refreshIcon{display:inline-block;}
  #refreshIcon.spin{animation:spin .8s linear infinite;}
  .last-updated{font-size:.8rem;color:var(--text-dim);}
  @keyframes spin{to{transform:rotate(360deg);}}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;min-width:0;}
  .btnrow{display:flex;gap:8px;flex:1 1 auto;min-width:0;}
  .btnrow .tbtn{flex:1 1 0;min-width:0;padding-left:6px;padding-right:6px;}
  .sortwrap{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--text-dim);min-width:0;}
  .sortwrap select{background:var(--bg-elev);color:var(--text);border:var(--bw) solid var(--border);
    border-radius:6px;padding:8px;font-family:var(--mono);font-size:17px;min-height:38px;max-width:100%;}
  .tbtn{background:var(--bg-elev);color:var(--text-dim);border:var(--bw) solid var(--border);
    border-radius:6px;padding:8px 12px;font-family:var(--mono);font-size:.88rem;cursor:pointer;min-height:38px;}
  .tbtn:hover{border-color:var(--accent);color:var(--text);}
  .tbtn.active{color:var(--bg);background:var(--accent);border-color:var(--accent);font-weight:700;}
  .chipcount{opacity:.65;margin-left:3px;}
  .card-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;min-width:0;}
  .icon-btn{background:transparent;border:1px solid var(--border);color:var(--text-dim);border-radius:6px;
    padding:7px 8px;font-family:var(--mono);font-size:.84rem;cursor:pointer;flex:1 1 calc(50% - 6px);
    text-align:center;min-height:34px;min-width:0;}
  .icon-btn:hover{border-color:var(--accent);color:var(--text);}
  .icon-btn.on{color:var(--accent2);border-color:var(--accent2);font-weight:700;}
  .icon-btn.cmp-btn.on{color:var(--accent);border-color:var(--accent);}
  .detail{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);
    font-size:.85rem;color:var(--text-dim);line-height:1.5;}
  .detail.open{display:block;}
  .compare-bar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;
    align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;max-width:calc(100vw - 32px);
    background:var(--bg-elev);border:var(--bw) solid var(--accent);border-radius:999px;padding:8px 16px;
    margin:14px auto 0;width:fit-content;font-size:.88rem;box-shadow:0 4px 14px rgba(0,0,0,.35);}
  .compare-view{background:var(--bg-elev);border:var(--bw) solid var(--border);border-radius:var(--radius);
    padding:16px;margin:14px 0;overflow-x:auto;}
  .compare-close{float:right;}
  .compare-table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:8px;}
  .compare-table th,.compare-table td{border:1px solid var(--border);padding:6px 8px;text-align:left;
    vertical-align:top;}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);
    background:var(--accent);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:.88rem;
    font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;
    max-width:calc(100vw - 32px);text-align:center;word-break:break-word;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  footer{margin-top:24px;padding:18px 0 8px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;gap:2px;border-top:var(--bw) solid var(--border);}
  .foot-inner{display:flex;flex-direction:column;align-items:center;justify-content:center;}
  footer p{margin:0;font-size:.85rem;color:var(--text-dim);}
  footer .made{font-size:.8rem;color:var(--text-dim);margin-top:2px;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  @media(max-width:420px){
    .toolbar{flex-direction:column;align-items:stretch;}
    .sortwrap{width:100%;justify-content:space-between;}
    .sortwrap select{flex:1;}
    .btnrow{width:100%;}
    .compare-bar{width:calc(100% - 32px);border-radius:var(--radius);}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div>
        <h1>Rankoo</h1>
        <p class="tag">World's best-selling software & apps</p>
      </div>
    </div>
    <button id="themeBtn" class="theme-btn" aria-label="Toggle theme">◐ <span id="themeLabel">Dark</span></button>
  </header>

  <main>
    <div class="search">
      <input id="query" type="text" autocomplete="off" placeholder="search by name or publisher…">
    </div>
    <div class="cat-dropdown">
      <button type="button" id="catToggle" class="cat-toggle" aria-expanded="false">
        <span id="catToggleLabel">All categories</span><span class="caret">▾</span>
      </button>
      <div class="chips" id="chips"></div>
    </div>

    <div class="refresh-row">
      <button type="button" id="refreshBtn" class="tbtn refresh-btn"><span id="refreshIcon">↻</span> Refresh data</button>
      <span class="last-updated" id="lastUpdated">Last updated: —</span>
    </div>

    <div class="toolbar">
      <label class="sortwrap">sort
        <select id="sortSelect">
          <option value="rank">Rank (high → low)</option>
          <option value="name">Name (A–Z)</option>
          <option value="category">Category</option>
        </select>
      </label>
      <div class="btnrow">
        <button type="button" id="favToggle" class="tbtn">☆ Favorites</button>
        <button type="button" id="exportCsv" class="tbtn">⇩ CSV</button>
        <button type="button" id="exportJson" class="tbtn">⇩ JSON</button>
      </div>
    </div>

    <p class="count" id="count"></p>
    <section class="grid" id="results"></section>
  </main>

  <div class="compare-bar" id="compareBar" hidden>
    <span id="compareCount">0 selected</span>
    <button type="button" id="compareOpen" class="tbtn">Compare</button>
    <button type="button" id="compareClear" class="tbtn">Clear</button>
  </div>
  <section class="compare-view" id="compareView" hidden></section>
  <div class="toast" id="toast"></div>


  <footer>
    <div class="foot-inner">
      <p id="copyright"></p>
      <p class="made">badges are generated initials, not official logos · founded/origin data is best-effort</p>
    </div>
  </footer>
</div>

  function parseStat(s){
    var m=s.match(/([\d,.]+)\s*([BMK]?)\+?/i);
    if(!m) return 0;
    var num=parseFloat(m[1].replace(/,/g,""));
    var suf=(m[2]||"").toUpperCase();
    if(suf==="B") num*=1e9;
    else if(suf==="M") num*=1e6;
    else if(suf==="K") num*=1e3;
    return num;
  }

  function hashHue(str){
    var h=0;
    for(var i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))>>>0; }
    return h%360;
  }
  function getInitials(name){
    var clean=name.replace(/[().:/+]/g," ").trim();
    var words=clean.split(/\s+/).filter(function(w){return w&&w!=="&"&&w!=="-";});
    if(words.length>=2) return (words[0][0]+words[1][0]).toUpperCase();
    return (words[0]||"").slice(0,2).toUpperCase();
  }

  function escapeHtml(s){
    var div=document.createElement("div");

  function getFilteredSortedList(){
    var q=document.getElementById("query").value.trim().toLowerCase();
    var list=DATA.filter(function(d){
      var catOk=activeCat==="All"||d.cat===activeCat;
      var qOk=!q||d.name.toLowerCase().indexOf(q)!==-1||d.pub.toLowerCase().indexOf(q)!==-1;
      var favOk=!showFavoritesOnly||favorites.has(d.name);
      return catOk&&qOk&&favOk;
    });
    if(sortMode==="name") list.sort(function(a,b){return a.name.localeCompare(b.name);});
    else if(sortMode==="category") list.sort(function(a,b){return a.cat.localeCompare(b.cat)||(parseStat(b.stat)-parseStat(a.stat));});
    else list.sort(function(a,b){return parseStat(b.stat)-parseStat(a.stat);});
    return list;
  }

  function render(){
    var list=getFilteredSortedList();
    var out=document.getElementById("results");
    document.getElementById("count").textContent=list.length+" of "+DATA.length+" entries";
    if(!list.length){
      out.innerHTML='<p class="empty">no matches — try a different name, category or favorites filter.</p>';
      return;
    }
    out.innerHTML=list.map(function(d){
      var isFav=favorites.has(d.name);
      var isCmp=compareSet.has(d.name);
      var isOpen=expandedSet.has(d.name);
      var foundedText=d.founded?d.founded:"—";

  document.getElementById("results").addEventListener("click",function(e){
    var btn=e.target.closest("button[data-action]");
    if(!btn) return;
    var card=btn.closest(".card");
    var name=card.getAttribute("data-name");
    var d=DATA.find(function(x){return x.name===name;});
    if(!d) return;
    var action=btn.dataset.action;
    if(action==="fav"){
      if(favorites.has(name)) favorites.delete(name); else favorites.add(name);
      render();
    }else if(action==="cmp"){
      if(compareSet.has(name)){
        compareSet.delete(name);
      }else{
        if(compareSet.size>=3){ showToast("You can compare up to 3 apps"); return; }
        compareSet.add(name);
      }
      updateCompareBar();
      render();
    }else if(action==="detail"){
      if(expandedSet.has(name)) expandedSet.delete(name); else expandedSet.add(name);
      render();
    }else if(action==="share"){
      var text=d.name+" — "+d.stat+" ("+d.pub+")";
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){showToast("Copied: "+d.name);})
          .catch(function(){showToast("Could not copy");});
      }else{
        showToast("Copy not supported in this browser");
      }
    }
  });

    compareView.hidden=false;
    document.getElementById("compareCloseBtn").addEventListener("click",function(){compareView.hidden=true;});
    compareView.scrollIntoView({behavior:"smooth",block:"nearest"});
  }
  document.getElementById("compareOpen").addEventListener("click",renderCompareView);
  document.getElementById("compareClear").addEventListener("click",function(){
    compareSet.clear();
    compareView.hidden=true;
    compareView.innerHTML="";
    updateCompareBar();
    render();
  });

  document.getElementById("sortSelect").addEventListener("change",function(e){
    sortMode=e.target.value;
    render();
  });

  var favToggle=document.getElementById("favToggle");
  favToggle.addEventListener("click",function(){
    showFavoritesOnly=!showFavoritesOnly;
    favToggle.classList.toggle("active",showFavoritesOnly);
    favToggle.textContent=showFavoritesOnly?"★ Favorites":"☆ Favorites";
    render();
  });

  function toCSVValue(v){
    v=String(v==null?"":v);
    if(/[",\n]/.test(v)) v='"'+v.replace(/"/g,'""')+'"';
    return v;
  }
  function downloadBlob(content,filename,mime){
    var blob=new Blob([content],{type:mime});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
  }
  document.getElementById("exportCsv").addEventListener("click",function(){
    var list=getFilteredSortedList();
    var header=["Global Rank","Name","Publisher","Category","Founded","Origin","Figure","Description"];
    var lines=[header.join(",")];
    list.forEach(function(d){
      lines.push([d.globalRank,d.name,d.pub,d.cat,d.founded||"",d.country,d.stat,d.blurb].map(toCSVValue).join(","));
    });
    downloadBlob(lines.join("\n"),"rankoo-list.csv","text/csv");
    showToast("CSV exported ("+list.length+" entries)");
  });
  document.getElementById("exportJson").addEventListener("click",function(){
    var list=getFilteredSortedList().map(function(d){
      return {rank:d.globalRank,name:d.name,publisher:d.pub,category:d.cat,founded:d.founded,
        country:d.country,figure:d.stat,description:d.blurb};
    });
    downloadBlob(JSON.stringify(list,null,2),"rankoo-list.json","application/json");
    showToast("JSON exported ("+list.length+" entries)");
  });

  document.getElementById("query").addEventListener("input",render);
  updateCompareBar();
  render();
})();

if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("service-worker.js").catch(function(err){
      console.warn("Service worker registration failed:",err);
    });
  });
}
</script>
</body>
</html>
